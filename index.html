<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome TO KSRG 2025</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

    <!-- DataTables Responsive CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">


</head>
body class="bg-gray-100 p-5">

  <div class="max-w-5xl mx-auto bg-white p-4 rounded shadow">

    <h2 class="text-xl font-semibold mb-4">Contoh Tabel Responsive</h2>

    <!-- RESPONSIVE WRAPPER -->
    <div class="overflow-x-auto">

      <table id="myTable" class="display nowrap w-full">
        <thead class="bg-gray-200">
          <tr>
            <th>Nama</th>
            <th>Email</th>
            <th>Umur</th>
            <th>Kota</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Andi</td>
            <td>andi@example.com</td>
            <td>25</td>
            <td>Jakarta</td>
          </tr>
          <tr>
            <td>Budi</td>
            <td>budi@example.com</td>
            <td>30</td>
            <td>Bandung</td>
          </tr>
          <tr>
            <td>Citra</td>
            <td>citra@example.com</td>
            <td>28</td>
            <td>Surabaya</td>
          </tr>
        </tbody>
      </table>

    </div>
  </div>

  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <!-- DataTables Responsive JS -->
  <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>

  <script>
    $(document).ready(function () {
      $("#myTable").DataTable({
        responsive: true,
        pageLength: 5,
      });
    });
  </script>

</body>
</html>
